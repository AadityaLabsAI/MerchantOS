# MerchantOS — single-host production stack.
# Self-contained. No third-party services. Everything runs locally.
version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: merchantos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d merchantos"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"   # only exposed to host (not internet)

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/merchantos
      DATABASE_SSL: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in .env}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:?set in .env}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AI_ENABLED: ${AI_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-owner@merchantos.local}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?set in .env}
      SEED_STORE_ID: ${SEED_STORE_ID:-01H0000000000000000000001}
      SEED_USER_ROLE: ${SEED_USER_ROLE:-OWNER}
    ports:
      - "4000:4000"

  # Optional: local AI (only if AI_ENABLED=true and you want it on the same host)
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    profiles: ["ai"]

volumes:
  pgdata:
  ollamadata:
