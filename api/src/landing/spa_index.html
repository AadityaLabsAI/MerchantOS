<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MerchantOS — 0% commission</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<meta name="description" content="Self-hosted POS, khata, and payments. 0% commission. No PhonePe, no Paytm, no fees.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='800'%3EM%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #ffffff;
  --bg-elev: #f8fafc;
  --bg-card: #ffffff;
  --bg-soft: #f1f5f9;
  --line: #e2e8f0;
  --line-soft: #f1f5f9;
  --text: #0f172a;
  --text-dim: #64748b;
  --text-mute: #94a3b8;
  --primary: #6d28d9;
  --primary-2: #7c3aed;
  --primary-3: #8b5cf6;
  --primary-soft: rgba(124, 58, 237, 0.08);
  --accent: #06b6d4;
  --accent-2: #ec4899;
  --ok: #10b981;
  --warn: #f59e0b;
  --bad: #ef4444;
  --grad-primary: linear-gradient(135deg, #6d28d9 0%, #7c3aed 50%, #ec4899 100%);
  --grad-hero: linear-gradient(135deg, #6d28d9 0%, #4f46e5 100%);
  --grad-ok: linear-gradient(135deg, #10b981 0%, #059669 100%);
  --grad-save: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow: 0 4px 16px -4px rgba(15, 23, 42, 0.08), 0 1px 4px -1px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 12px 40px -12px rgba(15, 23, 42, 0.12);
  --shadow-purple: 0 12px 40px -12px rgba(124, 58, 237, 0.4);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-lg: 22px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
}
[data-theme="dark"] {
  --bg: #0a0a13;
  --bg-elev: #12121d;
  --bg-card: #16161f;
  --bg-soft: #1c1c28;
  --line: #2a2a3a;
  --line-soft: #1f1f2c;
  --text: #f8fafc;
  --text-dim: #a0a0b8;
  --text-mute: #6b6b80;
  --primary-soft: rgba(124, 58, 237, 0.18);
  --shadow: 0 4px 16px -4px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 12px 40px -12px rgba(0, 0, 0, 0.6);
  --grad-primary: linear-gradient(135deg, #7c3aed 0%, #a855f7 50%, #ec4899 100%);
  --grad-hero: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior-y: contain; }
body { font-family: var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
input, select, textarea {
  font-family: inherit; font-size: 15px;
  background: var(--bg-soft); color: var(--text);
  border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 14px; outline: none; width: 100%; transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
::placeholder { color: var(--text-mute); }
.hidden { display: none !important; }

/* === LOGIN === */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); }
.login-card { width: 100%; max-width: 420px; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-lg); }
.login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
.brand-mark { width: 44px; height: 44px; border-radius: 12px; background: var(--grad-primary); display: grid; place-items: center; color: white; font-weight: 800; font-size: 22px; box-shadow: var(--shadow-purple); }
.brand-text { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
.brand-text small { display: block; font-size: 11px; color: var(--text-mute); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.login-title { font-size: 26px; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.02em; }
.login-sub { color: var(--text-dim); font-size: 14px; margin: 0 0 22px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
.btn-primary { width: 100%; padding: 14px; border: 0; border-radius: 12px; background: var(--grad-primary); color: white; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 15px; box-shadow: var(--shadow-purple); transition: transform .1s, box-shadow .15s; }
.btn-primary:hover { transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; }
.login-hint { margin-top: 18px; padding: 12px 14px; background: var(--primary-soft); border: 1px dashed rgba(124,58,237,.4); border-radius: 10px; font-size: 12px; color: var(--text-dim); }
.login-hint strong { color: var(--text); }
.login-hint code { color: var(--primary-2); font-weight: 700; }
.err { color: var(--bad); font-size: 13px; margin-top: 10px; min-height: 18px; }
.value-prop { margin-top: 24px; padding: 16px; border-radius: 14px; background: var(--grad-hero); color: white; text-align: center; }
.value-prop h4 { margin: 0 0 4px; font-size: 14px; font-weight: 700; }
.value-prop p { margin: 0; font-size: 12px; opacity: .9; }

/* === APP SHELL === */
.app { display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; max-width: 520px; margin: 0 auto; background: var(--bg); }
@media (min-width: 800px) { .app { max-width: 1100px; grid-template-columns: 240px 1fr; grid-template-rows: 1fr; } }

.app-header { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; background: var(--bg); border-bottom: 1px solid var(--line-soft); position: sticky; top: 0; z-index: 50; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.app-header .store { display: flex; align-items: center; gap: 10px; min-width: 0; }
.store-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--grad-primary); display: grid; place-items: center; color: white; font-weight: 800; font-size: 16px; flex-shrink: 0; }
.store-info { min-width: 0; }
.store-name { font-size: 14px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.store-status { font-size: 11px; color: var(--text-mute); display: flex; align-items: center; gap: 4px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.header-actions { display: flex; gap: 6px; align-items: center; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; background: var(--bg-soft); border: 1px solid var(--line); display: grid; place-items: center; cursor: pointer; color: var(--text-dim); }
.icon-btn:hover { background: var(--primary-soft); color: var(--primary); }

/* === MAIN === */
.main { padding: 16px 18px 100px; overflow-y: auto; }
@media (min-width: 800px) { .main { padding: 24px 32px 100px; } }

/* Hero card (Today's collection) */
.hero { background: var(--grad-hero); color: white; border-radius: var(--radius-lg); padding: 24px; margin-bottom: 18px; position: relative; overflow: hidden; box-shadow: var(--shadow-lg); }
.hero::after { content: ''; position: absolute; right: -40px; top: -40px; width: 200px; height: 200px; background: rgba(255,255,255,0.08); border-radius: 50%; }
.hero-label { font-size: 12px; opacity: .85; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
.hero-amount { font-size: 44px; font-weight: 800; margin: 6px 0 4px; letter-spacing: -0.02em; line-height: 1; }
.hero-sub { font-size: 13px; opacity: .9; }
.hero-stats { display: flex; gap: 16px; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.2); }
.hero-stat { flex: 1; }
.hero-stat-label { font-size: 10px; opacity: .8; text-transform: uppercase; letter-spacing: 0.06em; }
.hero-stat-value { font-size: 17px; font-weight: 800; margin-top: 2px; }

/* Savings card */
.savings { background: var(--grad-save); color: white; border-radius: var(--radius); padding: 14px 16px; margin-bottom: 18px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
.savings-icon { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.2); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
.savings-text { flex: 1; }
.savings-text .lbl { font-size: 11px; opacity: .9; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.savings-text .val { font-size: 18px; font-weight: 800; }
.savings-text .sub { font-size: 11px; opacity: .85; }

/* Quick action grid */
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
@media (min-width: 600px) { .actions { grid-template-columns: repeat(4, 1fr); } }
.action { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: transform .1s, border-color .15s, box-shadow .15s; text-align: center; }
.action:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow); }
.action-ico { width: 42px; height: 42px; border-radius: 12px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-size: 20px; }
.action.primary .action-ico { background: var(--grad-primary); color: white; }
.action-label { font-size: 11px; font-weight: 600; line-height: 1.2; }

/* Section header */
.sec-head { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 10px; }
.sec-title { font-size: 16px; font-weight: 700; }
.sec-link { font-size: 12px; color: var(--primary); font-weight: 600; cursor: pointer; }

/* Recent transactions */
.tx-list { display: flex; flex-direction: column; gap: 4px; }
.tx { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: background .1s; }
.tx:hover { background: var(--bg-soft); }
.tx-ico { width: 38px; height: 38px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-size: 16px; flex-shrink: 0; }
.tx-body { flex: 1; min-width: 0; }
.tx-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-sub { font-size: 11px; color: var(--text-mute); }
.tx-amount { font-size: 15px; font-weight: 700; }
.tx-state { font-size: 10px; padding: 3px 8px; border-radius: 999px; background: var(--bg-soft); color: var(--text-dim); font-weight: 600; text-transform: uppercase; }
.tx-state.verified { background: rgba(16,185,129,0.12); color: var(--ok); }
.tx-state.pending { background: rgba(245,158,11,0.12); color: var(--warn); }
.tx-state.failed { background: rgba(239,68,68,0.12); color: var(--bad); }

.empty { text-align: center; padding: 40px 20px; color: var(--text-mute); }
.empty-ico { font-size: 40px; opacity: .5; margin-bottom: 8px; }
.empty h4 { margin: 0 0 4px; color: var(--text-dim); font-size: 14px; }
.empty p { margin: 0 0 12px; font-size: 12px; }

/* === BOTTOM TABS === */
.tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 6px 8px; padding-bottom: max(6px, env(safe-area-inset-bottom)); z-index: 100; max-width: 520px; margin: 0 auto; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
@media (min-width: 800px) { .tabbar { position: sticky; bottom: 0; } }
.tab { background: transparent; border: 0; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-mute); cursor: pointer; flex: 1; font-size: 10px; font-weight: 600; min-width: 0; }
.tab-ico { font-size: 20px; line-height: 1; }
.tab.active { color: var(--primary); }
.tab.active .tab-ico { transform: scale(1.1); }

/* === ACCEPT PAYMENT === */
.accept-page { padding: 8px 0; }
.amount-display { text-align: center; padding: 24px 16px 16px; }
.amount-display .cur { font-size: 28px; color: var(--text-mute); font-weight: 600; vertical-align: top; margin-right: 6px; }
.amount-display .val { font-size: 56px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--text); }
.amount-display .empty-val { color: var(--text-mute); }
.quick-amounts { display: flex; gap: 8px; padding: 0 8px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; }
.quick-amt { padding: 8px 14px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--text-dim); cursor: pointer; }
.quick-amt:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }

.num-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 4px; }
.num-key { background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 14px; padding: 18px; font-size: 24px; font-weight: 600; color: var(--text); cursor: pointer; user-select: none; transition: background .1s; }
.num-key:active { background: var(--primary-soft); color: var(--primary); }
.num-key.action { background: var(--bg-soft); color: var(--primary); font-size: 18px; }
.num-key.action.del { color: var(--bad); }
.note-input { margin: 16px 0; }
.generate-btn { margin: 16px 0 8px; padding: 16px; background: var(--grad-primary); color: white; border: 0; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; box-shadow: var(--shadow-purple); }

/* === PAYMENT RESULT === */
.result-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; text-align: center; box-shadow: var(--shadow); margin-bottom: 16px; }
.result-amount { font-size: 44px; font-weight: 800; margin: 6px 0; background: var(--grad-primary); -webkit-background-clip: text; background-clip: text; color: transparent; }
.result-state { display: inline-block; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; margin-bottom: 14px; }
.qr-box { width: 220px; height: 220px; margin: 0 auto 14px; background: white; padding: 12px; border-radius: 16px; box-shadow: var(--shadow); }
.qr-box img { width: 100%; height: 100%; }
.share-link { background: var(--bg-soft); border: 1px dashed var(--line); border-radius: 10px; padding: 10px; font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; margin: 10px 0; color: var(--text-dim); }
.action-row { display: flex; gap: 8px; margin-top: 10px; }
.action-row button { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-card); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text); }
.action-row button.primary { background: var(--grad-primary); color: white; border: 0; }
.status-wait { display: flex; align-items: center; gap: 8px; justify-content: center; color: var(--text-dim); font-size: 13px; margin: 10px 0; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--primary); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* === KHATA / CUSTOMERS === */
.khata-hero { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; text-align: center; }
.khata-hero .label { font-size: 12px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.khata-hero .amount { font-size: 32px; font-weight: 800; margin: 4px 0; color: var(--warn); letter-spacing: -0.02em; }
.khata-hero .sub { font-size: 12px; color: var(--text-dim); }
.search-bar { margin-bottom: 14px; position: relative; }
.search-bar input { padding-left: 38px; }
.search-bar::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: 0.6; }

.cust-list { display: flex; flex-direction: column; gap: 8px; }
.cust-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: border-color .15s, transform .1s; }
.cust-card:hover { border-color: var(--primary); transform: translateY(-1px); }
.cust-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--bg-soft); display: grid; place-items: center; font-size: 18px; font-weight: 700; color: var(--text-dim); flex-shrink: 0; }
.cust-body { flex: 1; min-width: 0; }
.cust-name { font-size: 14px; font-weight: 700; }
.cust-phone { font-size: 11px; color: var(--text-mute); }
.cust-balance { font-size: 15px; font-weight: 800; }
.cust-balance.pos { color: var(--warn); }
.cust-balance.neg { color: var(--ok); }
.cust-balance.zero { color: var(--text-mute); }

/* === BOTTOM SHEET MODAL === */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 200; display: grid; place-items: end center; padding: 0; }
.sheet { background: var(--bg); width: 100%; max-width: 520px; max-height: 92vh; border-radius: 22px 22px 0 0; padding: 0; overflow-y: auto; animation: slideUp .25s ease-out; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); }
@media (min-width: 800px) { .sheet { border-radius: 22px; max-height: 80vh; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-handle { width: 40px; height: 4px; background: var(--line); border-radius: 2px; margin: 10px auto 0; }
.sheet-head { padding: 16px 20px 8px; display: flex; align-items: center; justify-content: space-between; }
.sheet-title { font-size: 18px; font-weight: 800; }
.sheet-close { background: var(--bg-soft); border: 0; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: var(--text-dim); font-size: 18px; }
.sheet-body { padding: 0 20px 20px; }
.sheet-foot { padding: 16px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
.sheet-foot button { flex: 1; padding: 14px; border-radius: 12px; border: 0; font-weight: 700; cursor: pointer; font-size: 14px; }
.sheet-foot .cancel { background: var(--bg-soft); color: var(--text); }
.sheet-foot .confirm { background: var(--grad-primary); color: white; }

/* === TOAST === */
.toasts { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 6px; pointer-events: none; max-width: 90vw; }
.toast { background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); animation: toastIn .2s ease-out; }
.toast.ok { background: var(--ok); color: white; }
.toast.bad { background: var(--bad); color: white; }
@keyframes toastIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* Ledger rows */
.ledger { display: flex; flex-direction: column; }
.ledger-row { display: grid; grid-template-columns: 80px 1fr 100px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); align-items: center; font-size: 13px; gap: 8px; }
.ledger-row .date { color: var(--text-mute); font-size: 11px; }
.ledger-row .desc { font-size: 13px; }
.ledger-row .type { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--bg-soft); color: var(--text-dim); margin-right: 4px; text-transform: uppercase; font-weight: 700; }
.ledger-row .amt { font-weight: 800; text-align: right; font-family: ui-monospace, monospace; }
.ledger-row .amt.pos { color: var(--ok); }
.ledger-row .amt.neg { color: var(--bad); }

/* Loading bar */
.loading-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--grad-primary); transform-origin: left; z-index: 9999; animation: load 1s ease-in-out infinite; }
@keyframes load { 0% { transform: scaleX(0); } 50% { transform: scaleX(0.7); } 100% { transform: scaleX(1); } }

.fab { position: fixed; bottom: 80px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--grad-primary); color: white; border: 0; font-size: 24px; box-shadow: var(--shadow-purple); cursor: pointer; z-index: 50; }
@media (min-width: 800px) { .fab { right: 32px; } }

/* More page list */
.menu-list { display: flex; flex-direction: column; gap: 1px; background: var(--line); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
.menu-item { background: var(--bg-card); padding: 16px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: background .1s; }
.menu-item:hover { background: var(--bg-soft); }
.menu-ico { width: 38px; height: 38px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-size: 18px; }
.menu-body { flex: 1; }
.menu-title { font-size: 14px; font-weight: 600; }
.menu-sub { font-size: 11px; color: var(--text-mute); }
.menu-arrow { color: var(--text-mute); font-size: 18px; }
</style>
</head>
<body>
